name: build
on: [pull_request, push]

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew -Pminecraft_version=${{ matrix.minecraft }} clean build
      - uses: actions/upload-artifact@v7
        with:
          name: FuschenAddons-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error
