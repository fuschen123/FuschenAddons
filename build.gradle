plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'maven-publish'
}

// All variants compile the same feature sources. Only proven API differences belong in compat/.
def targets = [
    '26.1.2': [api: '0.155.3+26.1.2', cascade: '2026.09.7+26.1'],
    '26.2': [api: '0.161.0+26.2', cascade: '2026.09.7+26.2'],
    '26.3': [api: '0.162.0+26.3', cascade: '2026.09.7+26.3']
]
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def target = targets[minecraftVersion]
if (target == null) throw new GradleException("Unsupported Minecraft target: ${minecraftVersion}; choose ${targets.keySet()}")
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraftVersion}")
base.archivesName = "FuschenAddons-${version}-mc${minecraftVersion}"

repositories { maven { url = 'https://maven.starred.foo/releases' } }

loom {
    splitEnvironmentSourceSets()
    mods {
        tsclient { sourceSet sourceSets.main; sourceSet sourceSets.client }
    }
    runs { client { runDir "run/${minecraftVersion}" } }
}
sourceSets.client.java.srcDir("src/compat/${minecraftVersion}/java")
sourceSets.client.kotlin.srcDir("src/compat/${minecraftVersion}/kotlin")

dependencies {
    // Minecraft 26.x is published unobfuscated; no Yarn or external mapping layer is needed.
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.api}"
    implementation include("foo.starred:cascade:${target.cascade}")
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin { jvmToolchain(25) }
test { useJUnitPlatform() }
processResources {
    def metadata = [version: project.version, minecraftVersion: minecraftVersion,
                    loaderVersion: loader_version, fabricApiVersion: target.api,
                    fabricKotlinVersion: fabric_kotlin_version]
    inputs.properties(metadata)
    filesMatching('fabric.mod.json') { expand metadata }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.withType(AbstractArchiveTask).configureEach { archiveVersion.set('') }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar {
    from('LICENSE') { rename { "${it}_FuschenAddons" } }
    from('THIRD_PARTY_NOTICES.md')
}
tasks.named('sourcesJar') { from('LICENSE', 'THIRD_PARTY_NOTICES.md') }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
